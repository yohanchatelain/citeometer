name: Update Metrics Snapshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch metrics snapshot
        run: node scripts/fetch-snapshot.js --input index.html demo --output dist/citeometer-snapshot.json
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}  # optional; avoids Semantic Scholar throttling

      - name: Commit and push snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/citeometer-snapshot.json
          git diff --staged --quiet || (git commit -m "chore: update static metrics snapshot [skip ci]" && git push)
